const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const resourceTiles=document.getElementById('resourceTiles'),resourceDialog=document.getElementById('resourceDialog'),dialogTitle=document.getElementById('dialogTitle'),dialogDescription=document.getElementById('dialogDescription'),dialogLinks=document.getElementById('dialogLinks'),resourceCount=document.getElementById('resourceCount'),searchResults=document.getElementById('searchResults');
let activeTile=null;
DATA.sections.forEach((section,i)=>{const tile=document.createElement('button');tile.type='button';tile.className='resource-tile';tile.dataset.search=(section.title+' '+section.subtitle+' '+section.items.map(x=>x.label).join(' ')).toLowerCase();tile.innerHTML=`<span class="tile-top"><span class="tile-number">${String(i+1).padStart(2,'0')}</span><span class="tile-open">OPEN</span></span><strong>${esc(section.title)}</strong><small>${esc(section.subtitle)}</small>`;tile.addEventListener('click',()=>{activeTile=tile;dialogTitle.textContent=section.title;dialogDescription.textContent=section.description;dialogLinks.innerHTML=section.items.map(item=>`<a class="dialog-link" href="${esc(item.url)}" target="_blank" rel="noopener"><span>${esc(item.label)}</span></a>`).join('');resourceDialog.showModal()});resourceTiles.append(tile)});
document.getElementById('dialogClose').addEventListener('click',()=>resourceDialog.close());resourceDialog.addEventListener('close',()=>{if(activeTile)activeTile.focus();activeTile=null});resourceDialog.addEventListener('click',e=>{if(e.target===resourceDialog)resourceDialog.close()});
const eventList=document.getElementById('eventList');
DATA.events.forEach(e=>{const entry=document.createElement('article');entry.className='event-entry';const button=document.createElement('button');button.type='button';button.className='event-row';button.setAttribute('aria-expanded','false');button.innerHTML=`<span class="event-date-chip"><small>${esc(e.month)}</small><strong>${esc(e.day)}</strong></span><span class="event-row-copy"><strong>${esc(e.title)}</strong><small>${esc(e.kind)} · ${esc(e.time)}</small></span><span class="event-more">Details</span>`;const detail=document.createElement('div');detail.className='event-expanded';detail.hidden=true;detail.innerHTML=`<p><strong>${esc(e.date)} · ${esc(e.time)}</strong></p><p>${esc(e.where)}${e.cost?' · '+esc(e.cost):''}</p><p>${esc(e.desc)}</p><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.cta)}</a>`;button.addEventListener('click',()=>{const open=button.getAttribute('aria-expanded')==='true';document.querySelectorAll('.event-row').forEach(b=>b.setAttribute('aria-expanded','false'));document.querySelectorAll('.event-expanded').forEach(d=>d.hidden=true);button.setAttribute('aria-expanded',String(!open));detail.hidden=open});entry.append(button,detail);eventList.append(entry)});
const input=document.getElementById('resourceSearch');
function filter(){const q=input.value.trim().toLowerCase();const tiles=[...document.querySelectorAll('.resource-tile')];tiles.forEach(tile=>tile.hidden=!!q);searchResults.hidden=!q;searchResults.replaceChildren();if(!q){resourceCount.textContent=`${tiles.length} topics`;return}let matches=0;DATA.sections.forEach(section=>{const moduleMatch=(section.title+' '+section.subtitle).toLowerCase().includes(q);section.items.filter(item=>moduleMatch||item.label.toLowerCase().includes(q)).forEach(item=>{matches++;const link=document.createElement('a');link.className='search-result';link.href=item.url;link.target='_blank';link.rel='noopener';link.innerHTML=`<span class="search-result-copy"><strong>${esc(item.label)}</strong><small>${esc(section.title)}</small></span>`;searchResults.append(link)})});if(!matches)searchResults.innerHTML='<div class="search-empty">No matching links found.</div>';resourceCount.textContent=`${matches} matching links`}
input.addEventListener('input',filter);filter();
</script>
